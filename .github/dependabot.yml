version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # tsc 7 rewrites types/ into declarations that TS 5 consumers reject (TS2309).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
